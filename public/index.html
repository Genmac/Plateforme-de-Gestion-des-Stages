<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Stages — Socle</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex">

  <!-- Barre latérale -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
    <div class="p-6 border-b border-slate-200">
      <h1 class="text-xl font-bold text-indigo-600">Gestion Stages</h1>
      <p class="text-xs text-slate-400 mt-1">Socle Technique v1.0</p>
    </div>

    <nav id="sidebar-menu" class="flex-1 p-4 space-y-1">
      <!-- Généré dynamiquement par menu.js -->
    </nav>

    <!-- Sélecteur DEV_AUTH pour tester facilement chaque rôle -->
    <div class="p-4 border-t border-slate-200 bg-slate-50">
      <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">
        Mode DEV_AUTH (Compte test)
      </label>
      <select id="dev-user-select" class="w-full text-sm border border-slate-300 rounded-md p-2 bg-white">
        <option value="1|admin">Mamadou Diallo (Admin)</option>
        <option value="2|responsable">Aissatou Ndiaye (Responsable)</option>
        <option value="3|etudiant">Cheikh Faye (Étudiant)</option>
        <option value="8|entreprise">Senegal Solutions (Entreprise)</option>
      </select>
    </div>
  </aside>

  <!-- Contenu principal -->
  <main class="flex-1 flex flex-col">
    <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
      <h2 class="font-semibold text-lg">Espace de travail</h2>
      <div class="flex items-center gap-4">
        <span id="health-badge" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
          Vérification API...
        </span>
      </div>
    </header>

    <section id="app-content" class="p-8 max-w-4xl">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <h3 class="text-lg font-semibold mb-2">Validation du Socle</h3>
        <p class="text-sm text-slate-600 mb-4">
          Changez de compte dans le menu en bas à gauche pour tester l'authentification <code>x-dev-user</code> et charger les notifications associées.
        </p>
        <button id="btn-load-notifs" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition">
          Tester GET /api/notifications
        </button>
        <pre id="api-output" class="mt-4 p-4 bg-slate-900 text-emerald-400 text-xs rounded-lg overflow-x-auto">En attente de test...</pre>
      </div>
    </section>
  </main>

  <script type="module">
    import { session } from './js/core/session.js';
    import { renderMenu } from './js/core/menu.js';
    import { apiFetch } from './js/core/api.js';

    // Initialisation du menu
    renderMenu();

    // Vérification du endpoint /health
    fetch('/health')
      .then(res => res.json())
      .then(data => {
        const badge = document.getElementById('health-badge');
        badge.textContent = `API: ${data.status} (${data.env})`;
        badge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-medium';
      })
      .catch(() => {
        const badge = document.getElementById('health-badge');
        badge.textContent = 'API Hors ligne';
        badge.className = 'text-xs px-2.5 py-1 rounded-full bg-red-100 text-red-700 font-medium';
      });

    // Gestion du changement de compte DEV_AUTH
    const select = document.getElementById('dev-user-select');
    select.addEventListener('change', (e) => {
      const [id, role] = e.target.value.split('|');
      session.setDevUser(id);
      session.setCurrentRole(role);
      renderMenu();
    });

    // Test de l'API notifications avec l'utilisateur sélectionné
    document.getElementById('btn-load-notifs').addEventListener('click', async () => {
      const output = document.getElementById('api-output');
      try {
        const res = await apiFetch('/notifications');
        output.textContent = JSON.stringify(res, null, 2);
      } catch (err) {
        output.textContent = `Erreur : ${err.message}`;
      }
    });
  </script>

  <!-- Module B : Entreprises & Candidatures (routage par hash #entreprises) -->
  <script type="module" src="./js/modules/entreprises/index.js"></script>
</body>
</html>
