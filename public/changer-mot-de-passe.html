<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mot de passe — Gestion des Stages</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center px-4"
  >
    <main class="w-full max-w-md">
      <h1 class="text-2xl font-bold text-indigo-600">
        Changer mon mot de passe
      </h1>
      <p id="avis" class="text-sm text-slate-600 mt-2"></p>

      <form
        id="form-mdp"
        class="mt-6 space-y-4 bg-white p-6 rounded-xl border border-slate-200 shadow-sm"
        novalidate
      >
        <label class="block text-sm"
          >Mot de passe actuel
          <input
            name="ancien"
            type="password"
            autocomplete="current-password"
            required
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </label>
        <label class="block text-sm"
          >Nouveau mot de passe
          <input
            name="nouveau"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <span class="mt-1 block text-xs text-slate-500"
            >8 caractères minimum, avec au moins une lettre et un chiffre.</span
          >
        </label>
        <label class="block text-sm"
          >Confirmer le nouveau mot de passe
          <input
            name="confirmation"
            type="password"
            autocomplete="new-password"
            required
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </label>
        <p
          id="erreur"
          role="alert"
          class="min-h-[1.25rem] text-sm text-red-600"
        ></p>
        <button
          id="bouton"
          type="submit"
          class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 transition disabled:opacity-60"
        >
          Enregistrer le mot de passe
        </button>
      </form>

      <div class="mt-4 flex items-center justify-between text-sm">
        <a
          id="lien-retour"
          href="/"
          class="text-indigo-600 hover:underline"
          hidden
          >Retour à l’application</a
        >
        <button
          id="btn-logout"
          type="button"
          class="text-slate-500 hover:underline ml-auto"
        >
          Se déconnecter
        </button>
      </div>
    </main>
    <script type="module" src="/js/modules/comptes/changerMdp.js"></script>
  </body>
</html>
